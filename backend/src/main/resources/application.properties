spring.application.name=room-rent-backend

# ===== MongoDB (Atlas) =====
# Override the connection string in production via the MONGODB_URI env var.
# Do NOT commit real credentials; rotate the password if it has been shared.
#
# The value below is the standard (non-SRV) form of the cluster's
# mongodb+srv://...@cluster0.sg9bj.mongodb.net/... connection string. It lists the
# replica-set members explicitly so it does not depend on a DNS SRV/TXT lookup
# (some JVMs/networks cannot perform SRV resolution). The mongodb+srv:// form also
# works on machines whose DNS supports it.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://santoshkumarscsebtech:dPdruUquqAl8TsUK@cluster0-shard-00-00.sg9bj.mongodb.net:27017,cluster0-shard-00-01.sg9bj.mongodb.net:27017,cluster0-shard-00-02.sg9bj.mongodb.net:27017/roomrent?ssl=true&replicaSet=atlas-wh0m1x-shard-0&authSource=admin&retryWrites=true&w=majority}
spring.data.mongodb.database=${MONGODB_DB:roomrent}
spring.data.mongodb.auto-index-creation=true

# ===== File upload =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload.dir=${UPLOAD_DIR:uploads}

# ===== JWT =====
# Override in production via env vars. Base64 not required; raw secret >= 32 chars.
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-for-room-rent-app-0123456789}
app.jwt.expiration-ms=86400000

# ===== Server =====
# Default 8081 locally (8080 is often taken). Cloud hosts (Render/Railway/etc.)
# inject the port via the PORT env var, which takes precedence when present.
server.port=${PORT:${SERVER_PORT:8081}}

# ===== Logging =====
logging.level.org.springframework.data.mongodb.core.MongoTemplate=warn
