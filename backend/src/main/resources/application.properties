spring.application.name=room-rent-backend

# ===== APPLICATION ENVIRONMENT =====
# Set via APP_ENV env var: dev, staging, production
app.environment=${APP_ENV:dev}

# ===== MongoDB (Atlas) =====
# REQUIRED: Set MONGODB_URI env var with your cluster connection string
# Format: mongodb://username:password@host1:27017,host2:27017,host3:27017/dbname?options
# 
# Use standard connection string (not mongodb+srv://) to avoid DNS SRV lookup issues
# Include: ssl=true, replicaSet=your-set-name, authSource=admin, retryWrites=true
# 
# See .env.example and ENV_SETUP.md for detailed instructions
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DB:roomrent}
spring.data.mongodb.auto-index-creation=true

# ===== File upload =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload.dir=${UPLOAD_DIR:uploads}

# ===== JWT =====
# REQUIRED: Set JWT_SECRET env var with a strong random secret (>= 32 chars)
# Generate: openssl rand -base64 32
# Store securely: use .env file (local) or env vars (cloud deployment)
# Expiration: 24 hours (86400000 ms)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ===== Server =====
# Port priority: PORT (cloud env var) > SERVER_PORT (local env var) > 8081 (default)
# Cloud platforms (Render, Railway, Heroku) inject PORT automatically
server.port=${PORT:${SERVER_PORT:8081}}

# ===== Logging =====
# Set LOGGER_LEVEL env var to control verbosity: TRACE, DEBUG, INFO, WARN, ERROR
logging.level.root=${LOGGER_LEVEL:INFO}
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN
logging.level.org.springframework.security=WARN
